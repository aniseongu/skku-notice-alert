name: Calendar diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - name: Check calendar event counts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
        run: |
          uv run python - <<'PY'
          import os
          from urllib.parse import quote
          import httpx
          from skku_notice.gcal import API, MARK, access_token
          with httpx.Client(timeout=15) as client:
              token = access_token(client, os.environ['GOOGLE_CLIENT_ID'], os.environ['GOOGLE_CLIENT_SECRET'],
                                   os.environ['GOOGLE_REFRESH_TOKEN'])
              client.headers['Authorization'] = f'Bearer {token}'
              url = f"{API}/calendars/{quote(os.environ['GOOGLE_CALENDAR_ID'], safe='')}/events"
              page, found, managed = None, 0, 0
              while True:
                  params = {'maxResults': 250}
                  if page:
                      params['pageToken'] = page
                  response = client.get(url, params=params)
                  response.raise_for_status()
                  data = response.json()
                  for event in data.get('items', []):
                      if '한국지도자육성' in event.get('summary', ''):
                          found += 1
                          managed += bool((event.get('extendedProperties') or {}).get('private', {}).get(MARK))
                  page = data.get('nextPageToken')
                  if not page:
                      break
              print(f'matching_events={found} managed_events={managed}')
          PY
