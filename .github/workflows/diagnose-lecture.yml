name: Diagnose lecture values (temporary)

on:
  workflow_dispatch:

# Share the collector lock because both jobs update the encrypted auth-attempt timestamp.
concurrency:
  group: notice-crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - name: Restore encrypted state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: state/canvas.enc
          key: canvas-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: canvas-encrypted-v1-
      - name: Open encrypted state
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: uv run python -m skku_notice.canvas_cache open
      - name: Count lecture value types without titles
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: |
          uv run python - <<'PY'
          import os, time
          from collections import Counter
          from dataclasses import replace
          from datetime import datetime
          from pathlib import Path
          import httpx
          from skku_notice.canvas import FAVORITES, _dt, _get_pages
          from skku_notice.canvas_alerts import load_canvas_state, save_canvas_state
          from skku_notice.deadline import KST
          from skku_notice.learningx import LearningXSession

          path = Path('state/canvas.json')
          state = load_canvas_state(path)
          now = datetime.now(KST)
          if state.last_learningx_launch and (
              now - datetime.fromisoformat(state.last_learningx_launch)
          ).total_seconds() < 3600:
              print('대기: 한 시간에 한 번만 시도해요, 마지막', state.last_learningx_launch)
              raise SystemExit(0)
          session = LearningXSession()
          try:
              with httpx.Client(headers={'Authorization': f'Bearer {os.environ["CANVAS_TOKEN"]}', 'Accept': 'application/json'},
                                timeout=10, follow_redirects=False) as client:
                  courses = _get_pages(client, FAVORITES)
                  save_canvas_state(path, replace(state, last_learningx_launch=now.isoformat()))
                  print('인증 성공:', session.authenticate(client, courses), '| 과목', len(courses))
                  total = Counter()
                  for course in courses:
                      time.sleep(1)
                      mods = session.read_modules(str(course['id']))
                      for mod in mods:
                          for row in mod.get('module_items') or []:
                              info = row.get('content_data') or {}
                              total['항목'] += 1
                              if info.get('use_attendance') is not True:
                                  continue
                              total['출석 사용'] += 1
                              due = _dt(info.get('due_at'))
                              if not due:
                                  total['마감 없음'] += 1
                                  continue
                              if due <= now:
                                  total['마감 지남'] += 1
                                  continue
                              total['마감 남음'] += 1
                              total['completed=' + repr(row.get('completed'))] += 1
                              total['attendance_status=' + repr(row.get('attendance_status'))] += 1
                  for key, value in sorted(total.items()):
                      print(key, value)
          finally:
              session.close()
          PY
      - name: Seal state
        if: always() && hashFiles('state/canvas.json') != ''
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: uv run python -m skku_notice.canvas_cache seal
      - name: Save encrypted state
        if: always() && hashFiles('state/canvas.enc') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: state/canvas.enc
          key: canvas-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
