name: Test browser notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Send browser test notification
        env:
          WEB_PUSH_SUBSCRIPTION: ${{ secrets.WEB_PUSH_SUBSCRIPTION }}
          # 기기별 알림 구독 칸(D-019). 모든 Secret을 한꺼번에 넘기지 않고 칸 이름으로만 받는다.
          WEB_PUSH_SUB_1: ${{ secrets.WEB_PUSH_SUB_1 }}
          WEB_PUSH_SUB_2: ${{ secrets.WEB_PUSH_SUB_2 }}
          WEB_PUSH_SUB_3: ${{ secrets.WEB_PUSH_SUB_3 }}
          WEB_PUSH_SUB_4: ${{ secrets.WEB_PUSH_SUB_4 }}
          WEB_PUSH_SUB_5: ${{ secrets.WEB_PUSH_SUB_5 }}
          WEB_PUSH_SUB_6: ${{ secrets.WEB_PUSH_SUB_6 }}
          WEB_PUSH_SUB_7: ${{ secrets.WEB_PUSH_SUB_7 }}
          WEB_PUSH_SUB_8: ${{ secrets.WEB_PUSH_SUB_8 }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
        run: |
          uv run python <<'PY'
          import base64, json, os
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          from py_vapid import Vapid
          from skku_notice.webpush_notify import send_web_push
          # 비밀 값은 찍지 않고 사이트 공개키와 짝이 맞는지만 알린다.
          public = Vapid.from_string(os.environ["WEB_PUSH_PRIVATE_KEY"]).public_key.public_bytes(
              Encoding.X962, PublicFormat.UncompressedPoint)
          expected = json.load(open("web/public/web-push.json"))["publicKey"]
          print("발송 키와 사이트 공개키 일치:", base64.urlsafe_b64encode(public).decode().rstrip("=") == expected)
          ok = send_web_push(
              "성대 공지 테스트 알림",
              "앱과 탭을 닫아도 브라우저가 켜져 있으면 알림을 받아요. 누르면 학교 공지가 열려요.",
              "https://cse.skku.edu/cse/notice.do?mode=view&articleNo=227471",
              "skku-notice-connection-test", "default",
          )
          if not ok:
              raise SystemExit("브라우저 알림을 보내지 못했어요. 알림 연결을 다시 확인해 주세요")
          print("브라우저 알림을 보냈어요")
          PY
