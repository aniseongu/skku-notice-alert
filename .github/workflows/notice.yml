name: Notice and Pages

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: notice
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  notice:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build PWA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: uv sync --frozen

      # RapidOCR 3.10.0 resolves its models under the installed package's
      # rapidocr/models directory (main.py and utils/download_models.py).
      - name: Cache RapidOCR models
        uses: actions/cache@v6
        with:
          path: .venv/lib/python3.*/site-packages/rapidocr/models
          key: rapidocr-3.10.0-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      # Canvas state contains personal course/assignment IDs. Keep it out of
      # the public repository; restore the most recent private Actions cache.
      - name: Restore Canvas state
        uses: actions/cache/restore@v6
        with:
          path: state/canvas.json
          key: canvas-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: canvas-state-

      - name: Prepare default rules
        run: |
          if [ ! -f config/rules.yaml ]; then
            cp config/rules.example.yaml config/rules.yaml
          fi

      - name: Run notice and export
        id: run_notice
        continue-on-error: true
        env:
          NOTIFY_URLS: ${{ secrets.NOTIFY_URLS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          INTEREST_KEYWORDS: ${{ vars.INTEREST_KEYWORDS }}
        run: uv run skku-notice --export site

      - name: Save Canvas state
        if: always() && hashFiles('state/canvas.json') != ''
        uses: actions/cache/save@v6
        with:
          path: state/canvas.json
          key: canvas-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit public state
        if: always()
        run: |
          for file in state/seen.json state/archive.json; do
            if [ -f "$file" ]; then
              git add -- "$file"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(state): update seen notices"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git pull --rebase origin "$GITHUB_REF_NAME"
            fi
          done
          exit 1

      - name: Upload Pages artifact
        if: steps.run_notice.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy Pages
        if: steps.run_notice.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report notice failure
        if: steps.run_notice.outcome == 'failure'
        run: exit 1
