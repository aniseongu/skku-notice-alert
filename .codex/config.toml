# Codex 프로젝트 설정 (신뢰된 프로젝트에서만 로드된다)
# 모델 선택 기준: .agents/skills/cross-agent/SKILL.md
#   기본(구현, 리뷰): gpt-6-sol medium. 어려우면 -c model_reasoning_effort="high"
#   가벼운 탐색: codex -m gpt-6-luna -c model_reasoning_effort="low"
#   gpt-6-astra 는 토큰 소모가 커서 사용자가 요청할 때만 쓴다
model = "gpt-6-sol"
model_reasoning_effort = "medium"

[sandbox_workspace_write]
# uv add, 원본 저장소 코드 받기(gh api), 실제 게시판 --dry-run 에 필요
network_access = true

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
