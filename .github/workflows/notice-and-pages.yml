name: Notice and Pages

on:
  schedule:
    # 정각과 15분 단위는 GitHub 예약이 몰려 늦거나 빠진다(공식 문서). 15분 간격은 유지한다.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# 화면 배포(pages.yml, group notice)와 대기 줄을 나눈다. 같은 줄이면 기다리던 이어 달리기 실행이 취소될 수 있다.
concurrency:
  group: notice-crawl
  cancel-in-progress: false

# 권한은 job마다 필요한 것만 준다. 학교 HTML을 읽는 notice job은 다음 실행을 부를 수 없다.
permissions: {}

jobs:
  # 마지막 수집 시각(사이트 notices.json의 generated_at)에서 14분이 안 지났으면 건너뛴다.
  # 예약 실행과 이어 달리기가 겹쳐도 학교 서버에 15분 안에 두 번 요청하지 않는다(crawling.md).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          last="$(curl -fsS --max-time 10 "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/api/v1/notices.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["generated_at"])' 2>/dev/null || true)"
          go=true
          if [ -n "$last" ]; then
            age=$(( $(date +%s) - $(date -d "$last" +%s) ))
            echo "마지막 수집 뒤 ${age}초"
            if [ "$age" -lt 840 ]; then go=false; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  notice:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build PWA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: uv sync --frozen

      # RapidOCR 3.10.0 resolves its models under the installed package's
      # rapidocr/models directory (main.py and utils/download_models.py).
      - name: Cache RapidOCR models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .venv/lib/python3.*/site-packages/rapidocr/models
          key: rapidocr-3.10.0-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      # Canvas state contains personal course/assignment IDs. Keep it out of
      # the public repository; restore the most recent private Actions cache.
      - name: Restore Canvas state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: state/canvas.json
          key: canvas-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: canvas-state-

      - name: Prepare default rules
        run: |
          if [ ! -f config/rules.yaml ]; then
            cp config/rules.example.yaml config/rules.yaml
          fi

      - name: Run notice and export
        id: run_notice
        continue-on-error: true
        env:
          NOTIFY_URLS: ${{ secrets.NOTIFY_URLS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          INTEREST_KEYWORDS: ${{ vars.INTEREST_KEYWORDS }}
          MUTED_CATEGORIES: ${{ vars.MUTED_CATEGORIES }}
          WEB_PUSH_SUBSCRIPTION: ${{ secrets.WEB_PUSH_SUBSCRIPTION }}
          # 기기별 알림 구독 칸(D-019). 모든 Secret을 한꺼번에 넘기지 않고 칸 이름으로만 받는다.
          WEB_PUSH_SUB_1: ${{ secrets.WEB_PUSH_SUB_1 }}
          WEB_PUSH_SUB_2: ${{ secrets.WEB_PUSH_SUB_2 }}
          WEB_PUSH_SUB_3: ${{ secrets.WEB_PUSH_SUB_3 }}
          WEB_PUSH_SUB_4: ${{ secrets.WEB_PUSH_SUB_4 }}
          WEB_PUSH_SUB_5: ${{ secrets.WEB_PUSH_SUB_5 }}
          WEB_PUSH_SUB_6: ${{ secrets.WEB_PUSH_SUB_6 }}
          WEB_PUSH_SUB_7: ${{ secrets.WEB_PUSH_SUB_7 }}
          WEB_PUSH_SUB_8: ${{ secrets.WEB_PUSH_SUB_8 }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
        run: uv run skku-notice --export site

      - name: Save Canvas state
        if: always() && hashFiles('state/canvas.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: state/canvas.json
          key: canvas-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit public state
        if: always()
        run: |
          for file in state/seen.json state/archive.json; do
            if [ -f "$file" ]; then
              git add -- "$file"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(state): update seen notices"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git pull --rebase origin "$GITHUB_REF_NAME"
            fi
          done
          exit 1

      - name: Upload Pages artifact
        if: steps.run_notice.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy Pages
        if: steps.run_notice.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Report notice failure
        if: steps.run_notice.outcome == 'failure'
        run: exit 1

  # 이어 달리기: 13분 쉬고 다음 실행을 부른다. 워크플로를 끄면 부르기가 실패해 멈춘다.
  # GITHUB_TOKEN이 부른 workflow_dispatch는 새 실행을 만든다(GitHub 문서 "When GITHUB_TOKEN triggers workflow runs").
  chain:
    needs: [gate, notice]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 다음 실행을 부르는 권한만(D-020). 코드를 받지 않고 gh 명령 두 개만 쓴다.
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          sleep 780
          # 이미 기다리거나 도는 다른 실행이 있으면(예약 실행이 살아난 경우) 또 부르지 않는다.
          others="$(gh run list --workflow notice-and-pages.yml --limit 10 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\"))] | length")"
          if [ "$others" = "0" ]; then
            gh workflow run notice-and-pages.yml --ref "${GITHUB_REF_NAME}"
            echo "다음 실행을 불렀어요"
          else
            echo "다른 실행이 있어 부르지 않았어요"
          fi
