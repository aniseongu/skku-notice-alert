# 감시할 게시판 목록. 추가 절차는 스킬 add-board.
# id는 state 키의 일부라 한 번 정하면 바꾸지 않는다.

user_agent: "skku-notice-alert/0.1 (+personal notice alert)"   # 저장소 URL이 생기면 넣는다
request_gap_seconds: 1.5    # 게시판 사이 쉬는 시간
timeout_seconds: 10

sources:
  - id: skku-notice01
    name: 성균관대 공지
    kind: skku-cms          # 학교 CMS 공통 파서 (docs/research/skku-board-structure.md)
    url: https://www.skku.edu/skku/campus/skk_comm/notice01.do

  - id: cse-notice
    name: 소프트웨어학과 공지
    kind: skku-cms
    url: https://cse.skku.edu/cse/notice.do
