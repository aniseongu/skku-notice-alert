name: Notice and Pages

on:
  schedule:
    # 학교 공지는 30분마다, 외부 인턴은 마지막 성공 확인 뒤 한 시간부터 확인한다.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      automatic:
        description: 'Run scheduled collection from the automatic relay'
        type: boolean
        default: false
        required: false

# 수집 실행끼리 겹치지 않도록 직렬화한다.
concurrency:
  group: notice-crawl
  queue: max
  cancel-in-progress: false

# 권한은 job마다 필요한 것만 준다. 학교 HTML을 읽는 notice job은 다음 실행을 부를 수 없다.
permissions: {}

jobs:
  # 마지막 수집 시각(사이트 notices.json의 generated_at)에서 14분이 안 지났으면 건너뛴다.
  # 수동 실행과 예약 실행이 겹쳐도 학교 서버에 자주 요청하지 않는다(crawling.md).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          last="$(curl -fsS --max-time 10 "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/api/v1/notices.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["generated_at"])' 2>/dev/null || true)"
          go=true
          if [ -n "$last" ]; then
            age=$(( $(date +%s) - $(date -d "$last" +%s) ))
            echo "마지막 수집 뒤 ${age}초"
            if [ "$age" -lt 840 ]; then go=false; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  notice:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build PWA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: uv sync --frozen

      # RapidOCR 3.10.0 resolves its models under the installed package's
      # rapidocr/models directory (main.py and utils/download_models.py).
      - name: Cache RapidOCR models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .venv/lib/python3.*/site-packages/rapidocr/models
          key: rapidocr-3.10.0-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      # Public-repository caches are readable. Cache only authenticated ciphertext.
      - name: Restore Canvas state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: state/canvas.enc
          key: canvas-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: canvas-encrypted-v1-

      - name: Open encrypted Canvas state
        continue-on-error: true
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: uv run python -m skku_notice.canvas_cache open

      - name: Prepare default rules
        run: |
          if [ ! -f config/rules.yaml ]; then
            cp config/rules.example.yaml config/rules.yaml
          fi

      - name: Run notice and export
        id: run_notice
        continue-on-error: true
        env:
          AUTOMATIC_RUN: ${{ inputs.automatic }}
          CANVAS_SUMMARY_TIME: ${{ vars.CANVAS_SUMMARY_TIME }}
          NOTIFY_URLS: ${{ secrets.NOTIFY_URLS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          INTEREST_KEYWORDS: ${{ vars.INTEREST_KEYWORDS }}
          MUTED_CATEGORIES: ${{ vars.MUTED_CATEGORIES }}
          # 저장한 공지는 수정 확인 대상이다(D-025).
          SAVED_NOTICES: ${{ vars.SAVED_NOTICES }}
          WEB_PUSH_SUBSCRIPTION: ${{ secrets.WEB_PUSH_SUBSCRIPTION }}
          # 기기별 알림 구독 칸(D-019). 모든 Secret을 한꺼번에 넘기지 않고 칸 이름으로만 받는다.
          WEB_PUSH_SUB_1: ${{ secrets.WEB_PUSH_SUB_1 }}
          WEB_PUSH_SUB_2: ${{ secrets.WEB_PUSH_SUB_2 }}
          WEB_PUSH_SUB_3: ${{ secrets.WEB_PUSH_SUB_3 }}
          WEB_PUSH_SUB_4: ${{ secrets.WEB_PUSH_SUB_4 }}
          WEB_PUSH_SUB_5: ${{ secrets.WEB_PUSH_SUB_5 }}
          WEB_PUSH_SUB_6: ${{ secrets.WEB_PUSH_SUB_6 }}
          WEB_PUSH_SUB_7: ${{ secrets.WEB_PUSH_SUB_7 }}
          WEB_PUSH_SUB_8: ${{ secrets.WEB_PUSH_SUB_8 }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$AUTOMATIC_RUN" = true ]; then
            uv run skku-notice --export site --external-if-due
          else
            uv run skku-notice --export site
          fi

      # 구글 캘린더 자동 연결(설정에서 연결했을 때만). 실패해도 공지 수집과 배포는 그대로 간다.
      - name: Sync Google Calendar
        if: steps.run_notice.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          SAVED_NOTICES: ${{ vars.SAVED_NOTICES }}
        run: uv run python -m skku_notice.gcal

      - name: Seal Canvas state
        if: always() && hashFiles('state/canvas.json') != ''
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: uv run python -m skku_notice.canvas_cache seal

      - name: Save Canvas state
        if: always() && hashFiles('state/canvas.enc') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: state/canvas.enc
          key: canvas-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit public state
        if: always()
        run: |
          for file in state/seen.json state/archive.json; do
            if [ -f "$file" ]; then
              git add -- "$file"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'aniseongu'
          git config user.email '87381208+aniseongu@users.noreply.github.com'
          git commit -m "chore(state): update seen notices"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git pull --rebase origin "$GITHUB_REF_NAME"
            fi
          done
          exit 1

      - name: Upload Pages artifact
        if: steps.run_notice.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Report notice failure
        if: steps.run_notice.outcome == 'failure'
        run: exit 1

  # 배포만 직렬화한다. UI 변경이 몰려도 이미 대기 중인 수집 자체는 취소하지 않는다.
  deploy:
    needs: notice
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # 대기는 별도 워크플로에 맡겨 수동 수집이 notice-crawl 잠금에서 기다리지 않게 한다.
  chain:
    needs: [gate, notice]
    if: always() && !cancelled() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Start collection relay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 기존 relay가 막 끝나는 중이어도 다음 대기를 빠뜨리지 않는다.
          gh workflow run notice-relay.yml --ref "${GITHUB_REF_NAME}"
          echo "다음 수집 대기를 요청했어요"
