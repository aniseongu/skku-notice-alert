[project]
name = "skku-notice-alert"
version = "0.1.0"
description = "성균관대 공지 게시판을 읽어 내 기준에 맞는 글만 알림으로 보낸다"
readme = "README.md"
requires-python = ">=3.12"
# M1 계획 2단계에서 `uv add httpx selectolax pyyaml apprise`로 채운다(버전은 uv.lock이 고정).
dependencies = []

[project.scripts]
skku-notice = "skku_notice.cli:main"

[dependency-groups]
dev = []   # M1 계획 2단계에서 `uv add --dev pytest ruff`

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skku_notice"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
